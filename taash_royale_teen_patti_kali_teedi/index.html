<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#071910" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="logo.svg" />
  <title>Taash Royale — Teen Patti & Kali Ni Teedi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="noise"></div>
    <header class="topbar">
      <button class="icon-btn" id="homeBtn" title="Home">⌂</button>
      <div class="brand-mini"><span>♠</span> TAASH ROYALE</div>
      <div class="top-actions">
        <button class="icon-btn" id="soundBtn" title="Sound">🔊</button>
        <button class="icon-btn" id="helpBtn" title="Rules">?</button>
      </div>
    </header>

    <main>
      <section id="homeScreen" class="screen active home-screen">
        <div class="hero">
          <div class="eyebrow">INDIAN CARD TABLE</div>
          <h1>TAASH<br><span>ROYALE</span></h1>
          <p>Two classics. One table. Play offline against smart bots.</p>
          <div class="game-grid">
            <button class="game-tile teen-tile" data-game="teen">
              <div class="tile-cards">
                <span class="mini-card c1">A♠</span>
                <span class="mini-card c2 red">K♥</span>
                <span class="mini-card c3">Q♣</span>
              </div>
              <div class="tile-copy">
                <small>CLASSIC</small>
                <strong>Teen Patti</strong>
                <span>3-card showdown • Blind / Seen • Virtual chips</span>
              </div>
              <b>PLAY →</b>
            </button>

            <button class="game-tile kali-tile" data-game="kali">
              <div class="black-three">3<span>♠</span></div>
              <div class="tile-copy">
                <small>GUJARATI CLASSIC</small>
                <strong>Kali Ni Teedi</strong>
                <span>Bid • Hukum • Hidden partner • 13 tricks</span>
              </div>
              <b>PLAY →</b>
            </button>
          </div>

          <div class="home-note">No real-money betting. Chips are only for local gameplay.</div>
        </div>
      </section>

      <section id="gameScreen" class="screen game-screen">
        <div class="table-wrap">
          <div class="table-glow"></div>
          <div id="table" class="table">
            <div class="felt-mark">TAASH<br><span>ROYALE</span></div>
            <div id="statusPill" class="status-pill">READY</div>

            <div class="seat seat-top" data-seat="2">
              <div class="avatar">R</div>
              <div class="player-meta"><b>Riya</b><span id="meta2">Bot</span></div>
              <div class="seat-cards" id="seatCards2"></div>
            </div>
            <div class="seat seat-left" data-seat="1">
              <div class="avatar">A</div>
              <div class="player-meta"><b>Arjun</b><span id="meta1">Bot</span></div>
              <div class="seat-cards" id="seatCards1"></div>
            </div>
            <div class="seat seat-right" data-seat="3">
              <div class="avatar">K</div>
              <div class="player-meta"><b>Kabir</b><span id="meta3">Bot</span></div>
              <div class="seat-cards" id="seatCards3"></div>
            </div>
            <div class="seat seat-bottom you-seat" data-seat="0">
              <div class="avatar you">YOU</div>
              <div class="player-meta"><b>You</b><span id="meta0">Player</span></div>
            </div>

            <div id="centerArea" class="center-area"></div>
            <div id="humanHand" class="human-hand"></div>
          </div>
        </div>

        <div id="controls" class="controls"></div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <div id="modal" class="modal">
      <div class="modal-card">
        <button id="modalClose" class="modal-x">×</button>
        <div id="modalContent"></div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
